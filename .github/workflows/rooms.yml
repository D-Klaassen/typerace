# The Rooms server deploys itself whenever main changes what it runs, so it
# never lags behind the web app, which Vercel deploys on every push to main.
# Pull requests that touch it get the same checks without the deploy.
name: Rooms

on:
  push:
    branches: [main]
    paths:
      - apps/rooms/**
      - packages/game/**
      - packages/protocol/**
      - pnpm-lock.yaml
      - .github/workflows/rooms.yml
  pull_request:
    paths:
      - apps/rooms/**
      - packages/game/**
      - packages/protocol/**
      - pnpm-lock.yaml
      - .github/workflows/rooms.yml
  workflow_dispatch:

# Never two deploys at once; a newer push waits for the running one.
concurrency:
  group: rooms-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pnpm check without the Playwright tests, which need browsers.
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN secret and the CLOUDFLARE_ACCOUNT_ID variable (see README, Deploy)."
            exit 1
          fi
          pnpm deploy:rooms
